<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joliee Store - Catálogo Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: #881337; }
        .bg-primary { background-color: var(--primary-color) !important; }
        .text-primary { color: var(--primary-color) !important; }
        .border-primary { border-color: var(--primary-color) !important; }
        .hover\:bg-primary-dark:hover { filter: brightness(85%); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <!-- LOGO GRANDE -->
                <img id="store-logo-img" src="" alt="Logo" class="w-20 h-20 object-cover rounded-full hidden shadow-md border-2 border-primary">
                <div>
                    <h1 id="store-title" class="text-3xl font-bold text-primary tracking-wide">Joliee Store</h1>
                    <p id="store-subtitle" class="text-sm text-gray-500">Catálogo Oficial</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="openAdminModal()" class="p-2 text-gray-600 hover:text-primary transition rounded-full hover:bg-gray-100">
                    <i class="fa-solid fa-gear text-xl"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- Buscador y Filtros -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400"></i>
                <input type="text" id="search-input" oninput="filterProducts()" placeholder="Buscar por producto..." class="w-full pl-10 pr-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary bg-white">
            </div>
            <div id="categories-container" class="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-2">
                <!-- Categorías dinámicas -->
            </div>
        </div>

        <!-- Grid de Productos -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Renderizado dinámico -->
        </div>
        <div id="no-products" class="hidden text-center py-16 text-gray-400">
            No se encontraron productos.
        </div>

        <!-- PAGINACIÓN ABREVIADA -->
        <div id="pagination-container" class="flex flex-wrap justify-center items-center gap-2 mt-10 pb-6">
            <!-- Botones numéricos con puntos suspensivos -->
        </div>
    </main>

    <!-- Modal Detalle de Producto -->
    <div id="product-detail-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl relative animate-fadeIn">
            <button onclick="closeProductDetail()" class="absolute top-4 right-4 bg-white/80 hover:bg-white p-2 rounded-full text-gray-700 transition shadow z-10">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="bg-gray-100 flex items-center justify-center">
                <!-- IMAGEN AMPLIADA COMPLETA SIN RECORTAR -->
                <img id="detail-main-img" src="" alt="Producto" class="w-full h-96 object-contain p-2">
                <!-- Miniaturas de galería -->
                <div id="detail-gallery-thumbs" class="flex gap-2 p-3 overflow-x-auto bg-gray-50 border-t hidden absolute bottom-0 w-full"></div>
            </div>
            <div class="p-6">
                <span id="detail-product-cat" class="text-xs font-semibold text-primary uppercase tracking-wider"></span>
                <h2 id="detail-product-title" class="text-xl font-bold text-gray-900 mt-1"></h2>
                <p id="detail-product-price" class="text-2xl font-black text-primary mt-2"></p>
                <p id="detail-product-desc" class="text-gray-600 text-sm mt-4 leading-relaxed"></p>
                <div class="mt-6 pt-4 border-t flex justify-between items-center">
                    <span id="detail-product-status" class="text-xs px-3 py-1 rounded-full font-medium">Disponible</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Admin / Configuración -->
    <div id="admin-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-lg font-bold text-primary">Panel de Administración</h3>
                <button onclick="closeAdminModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <!-- Login Admin (Contraseña) -->
            <div id="admin-login-section">
                <p class="text-sm text-gray-600 mb-3">Introduce la clave de acceso:</p>
                <input type="password" id="admin-pass-input" placeholder="Contraseña" class="w-full p-2 border rounded-xl mb-3">
                <button onclick="verifyAdminPassword()" class="w-full bg-primary text-white py-2 rounded-xl font-medium hover:bg-primary-dark transition">Entrar</button>
            </div>

            <!-- Contenido Admin con Pestañas -->
            <div id="admin-panel-content" class="hidden space-y-4">
                
                <!-- Navegación por Pestañas -->
                <div class="flex border-b border-gray-200">
                    <button type="button" id="tab-btn-products" onclick="switchAdminTab('products')" class="py-2 px-4 text-sm font-bold border-b-2 border-primary text-primary transition focus:outline-none">
                        <i class="fa-solid fa-box-open mr-2"></i>Lista de Productos
                    </button>
                    <button type="button" id="tab-btn-config" onclick="switchAdminTab('config')" class="py-2 px-4 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition focus:outline-none">
                        <i class="fa-solid fa-sliders mr-2"></i>Personalizar Tienda
                    </button>
                </div>

                <!-- Pestaña 1: Lista de Productos -->
                <div id="tab-content-products" class="space-y-4">
                    <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
                        <h4 class="font-bold text-gray-800 text-sm">Productos Registrados</h4>
                        <div class="relative w-full sm:w-64">
                            <i class="fa-solid fa-search absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                            <input type="text" id="admin-search-input" oninput="renderAdminProductsList()" placeholder="Buscar producto en lista..." class="w-full pl-8 pr-3 py-1.5 border rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-primary bg-white">
                        </div>
                        <button type="button" onclick="openProductForm()" class="bg-primary text-white px-3 py-1.5 rounded-xl text-sm font-medium hover:bg-primary-dark transition whitespace-nowrap"><i class="fa-solid fa-plus mr-1"></i> Nuevo Producto</button>
                    </div>
                    <div id="admin-products-list" class="space-y-2 max-h-80 overflow-y-auto pr-1 border rounded-xl p-2 bg-gray-50">
                        <!-- Renderizado de productos para admin -->
                    </div>
                </div>

                <!-- Pestaña 2: Personalizar Tienda -->
                <div id="tab-content-config" class="hidden bg-gray-50 p-4 rounded-xl border space-y-3">
                    <h4 class="font-bold text-gray-800">Personalizar Tienda, Apariencia y Seguridad</h4>
                    <div>
                        <label class="text-xs font-semibold text-gray-600">Nombre de la Tienda</label>
                        <input type="text" id="cfg-title" class="w-full p-2 border rounded-xl bg-white text-sm">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-600">Subtítulo / Eslogan</label>
                        <input type="text" id="cfg-subtitle" class="w-full p-2 border rounded-xl bg-white text-sm">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-600">URL del Logo / Imagen de la Tienda</label>
                        <input type="text" id="cfg-logo" class="w-full p-2 border rounded-xl bg-white text-sm" placeholder="https://...">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-600">Paleta de Colores (Color Principal)</label>
                        <div class="flex items-center gap-3 mt-1">
                            <input type="color" id="cfg-color" value="#881337" class="w-12 h-10 p-1 border rounded-lg cursor-pointer bg-white">
                            <span class="text-xs text-gray-500">Selecciona el tono corporativo de tu tienda</span>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-600">Nueva Contraseña de Administrador</label>
                        <input type="password" id="cfg-pass" class="w-full p-2 border rounded-xl bg-white text-sm" placeholder="Dejar en blanco para mantener la actual">
                    </div>
                    <button type="button" onclick="saveStoreConfig()" class="w-full bg-gray-800 text-white py-2 rounded-xl text-sm font-medium hover:bg-gray-900 transition">Guardar Cambios de Apariencia</button>
                </div>

            </div>

            <!-- Formulario de Producto -->
            <div id="product-form-container" class="hidden mt-4 pt-4 border-t">
                <h4 id="form-action-title" class="font-bold text-gray-800 mb-3">Añadir / Editar Producto</h4>
                <input type="hidden" id="form-id">
                <div class="space-y-3">
                    <input type="text" id="form-title-input" placeholder="Título del producto" class="w-full p-2 border rounded-xl text-sm">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="form-cat-input" placeholder="Categoría" class="w-full p-2 border rounded-xl text-sm">
                        <input type="text" id="form-price-input" placeholder="Precio ($)" class="w-full p-2 border rounded-xl text-sm">
                    </div>
                    <input type="text" id="form-img-input" placeholder="URL Imagen Principal" class="w-full p-2 border rounded-xl text-sm">
                    <input type="text" id="form-gallery-input" placeholder="URLs adicionales separadas por comas (,)" class="w-full p-2 border rounded-xl text-sm">
                    <textarea id="form-desc-input" placeholder="Descripción detallada" class="w-full p-2 border rounded-xl h-20 resize-none text-sm"></textarea>
                    
                    <!-- Disponibilidad y Ocultar de la página principal -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t">
                        <div>
                            <label class="text-xs font-semibold text-gray-600 block mb-1">Disponibilidad</label>
                            <select id="form-status-input" class="w-full p-2 border rounded-xl bg-white text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                                <option value="Disponible">Disponible</option>
                                <option value="Agotado">Agotado</option>
                            </select>
                        </div>
                        <div class="flex items-center pt-5">
                            <label class="flex items-center gap-2 cursor-pointer select-none">
                                <input type="checkbox" id="form-hidden-input" class="w-4 h-4 text-primary rounded border-gray-300 focus:ring-primary">
                                <span class="text-xs font-semibold text-gray-700">Ocultar de la página principal</span>
                            </label>
                        </div>
                    </div>

                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="cancelProductForm()" class="px-4 py-2 bg-gray-200 rounded-xl text-sm font-medium">Cancelar</button>
                        <button type="button" onclick="saveProductToCloud()" class="px-4 py-2 bg-primary text-white rounded-xl text-sm font-medium hover:bg-primary-dark">Guardar Producto</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK y Script Principal -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBKoLN6-BfqP-M7KydSV1E5Ey3w6f6P7E",
            authDomain: "joliee-store.firebaseapp.com",
            projectId: "joliee-store",
            storageBucket: "joliee-store.firebasestorage.app",
            messagingSenderId: "1043661690772",
            appId: "1:1043661690772:web:4d728e1546e755b0fbe181"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentProducts = [];
        let storeConfig = { title: "Joliee Store", subtitle: "Catálogo Oficial", logo: "", primaryColor: "#881337", adminPass: "1234" };
        let selectedCategory = 'Todos';
        let currentPage = 1;
        const itemsPerPage = 12;

        function applyThemeColor(color) {
            if (!color) return;
            document.documentElement.style.setProperty('--primary-color', color);
        }

        async function loadStoreData() {
            try {
                const cfgRef = doc(db, "store_data", "config");
                const cfgSnap = await getDoc(cfgRef);
                if (cfgSnap.exists()) {
                    storeConfig = { ...storeConfig, ...cfgSnap.data() };
                }
                document.getElementById('store-title').innerText = storeConfig.title || "Joliee Store";
                document.getElementById('store-subtitle').innerText = storeConfig.subtitle || "Catálogo Oficial";
                applyThemeColor(storeConfig.primaryColor || "#881337");
                
                const logoImg = document.getElementById('store-logo-img');
                if (storeConfig.logo) {
                    logoImg.src = storeConfig.logo;
                    logoImg.classList.remove('hidden');
                } else {
                    logoImg.classList.add('hidden');
                }

                const prodRef = doc(db, "store_data", "products_list");
                const prodSnap = await getDoc(prodRef);
                
                let cloudProducts = [];
                if (prodSnap.exists()) {
                    const data = prodSnap.data();
                    cloudProducts = Object.values(data).filter(item => typeof item === 'object' && item !== null && 'id' in item);
                }

                // PROTECCIÓN ANTIBORRADO: Si Firebase tiene productos, se quedan en firme sin sobrescribirse jamás
                if (cloudProducts.length > 0) {
                    currentProducts = cloudProducts;
                } else {
                    currentProducts = [];
                }
            } catch (err) {
                console.error("Error al cargar la tienda:", err);
                currentProducts = [];
            }
            renderCategories();
            renderProducts();
        }

        window.saveStoreConfig = async function() {
            const title = document.getElementById('cfg-title').value.trim();
            const subtitle = document.getElementById('cfg-subtitle').value.trim();
            const logo = document.getElementById('cfg-logo').value.trim();
            const primaryColor = document.getElementById('cfg-color').value;
            const newPass = document.getElementById('cfg-pass').value.trim();

            storeConfig.title = title || "Joliee Store";
            storeConfig.subtitle = subtitle || "Catálogo Oficial";
            storeConfig.logo = logo;
            storeConfig.primaryColor = primaryColor || "#881337";
            if (newPass) {
                storeConfig.adminPass = newPass;
            }

            try {
                await setDoc(doc(db, "store_data", "config"), storeConfig, { merge: true });
                document.getElementById('store-title').innerText = storeConfig.title;
                document.getElementById('store-subtitle').innerText = storeConfig.subtitle;
                applyThemeColor(storeConfig.primaryColor);
                
                const logoImg = document.getElementById('store-logo-img');
                if (storeConfig.logo) {
                    logoImg.src = storeConfig.logo;
                    logoImg.classList.remove('hidden');
                } else {
                    logoImg.classList.add('hidden');
                }
                alert('¡Configuración guardada con éxito!');
            } catch (err) {
                alert('Error al guardar configuración: ' + err.message);
            }
        }

        window.switchAdminTab = function(tabName) {
            const btnProducts = document.getElementById('tab-btn-products');
            const btnConfig = document.getElementById('tab-btn-config');
            const contentProducts = document.getElementById('tab-content-products');
            const contentConfig = document.getElementById('tab-content-config');

            if (tabName === 'products') {
                btnProducts.className = "py-2 px-4 text-sm font-bold border-b-2 border-primary text-primary transition focus:outline-none";
                btnConfig.className = "py-2 px-4 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition focus:outline-none";
                contentProducts.style.display = 'block';
                contentConfig.style.display = 'none';
            } else {
                btnConfig.className = "py-2 px-4 text-sm font-bold border-b-2 border-primary text-primary transition focus:outline-none";
                btnProducts.className = "py-2 px-4 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition focus:outline-none";
                contentConfig.style.display = 'block';
                contentProducts.style.display = 'none';
            }
        }

        window.renderCategories = function() {
            const container = document.getElementById('categories-container');
            const visibleProds = currentProducts.filter(p => !p.isHidden);
            const cats = ['Todos', ...new Set(visibleProds.map(p => p.cat).filter(Boolean))];
            container.innerHTML = cats.map(cat => `
                <button onclick="filterByCategory('${cat}')" class="px-4 py-1.5 rounded-xl text-sm font-medium whitespace-nowrap transition ${selectedCategory === cat ? 'bg-primary text-white shadow' : 'bg-white border text-gray-600 hover:bg-gray-100'}">
                    ${cat}
                </button>
            `).join('');
        }

        window.filterByCategory = function(cat) {
            selectedCategory = cat;
            currentPage = 1;
            renderCategories();
            renderProducts();
        }

        window.filterProducts = function() {
            currentPage = 1;
            renderProducts();
        }

        window.renderProducts = function() {
            const grid = document.getElementById('products-grid');
            const noProd = document.getElementById('no-products');
            const paginationContainer = document.getElementById('pagination-container');
            const query = document.getElementById('search-input').value.toLowerCase();

            const filtered = currentProducts.filter(p => {
                if (p.isHidden) return false;
                const matchesCat = selectedCategory === 'Todos' || p.cat === selectedCategory;
                const matchesQuery = p.title.toLowerCase().includes(query) || (p.desc && p.desc.toLowerCase().includes(query));
                return matchesCat && matchesQuery;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                paginationContainer.innerHTML = '';
                noProd.classList.remove('hidden');
                return;
            }
            noProd.classList.add('hidden');

            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            if (currentPage > totalPages) currentPage = totalPages;
            
            const startIdx = (currentPage - 1) * itemsPerPage;
            const paginatedItems = filtered.slice(startIdx, startIdx + itemsPerPage);

            grid.innerHTML = paginatedItems.map(p => {
                const isAgotado = p.status === 'Agotado';
                return `
                <div onclick="openProductDetail(${p.id})" class="bg-white rounded-2xl shadow-sm hover:shadow-md transition overflow-hidden border cursor-pointer flex flex-col relative">
                    ${isAgotado ? '<span class="absolute top-2 right-2 bg-red-100 text-red-700 text-[10px] font-bold px-2 py-0.5 rounded-full z-10">Agotado</span>' : ''}
                    <div class="w-full h-52 bg-gray-50 flex items-center justify-center overflow-hidden">
                        <img src="${p.img || 'https://via.placeholder.com/300'}" alt="${p.title}" class="w-full h-full object-contain p-2">
                    </div>
                    <div class="p-4 flex flex-col flex-grow">
                        <span class="text-xs text-primary font-semibold uppercase">${p.cat}</span>
                        <h3 class="font-bold text-gray-800 text-base mt-1 line-clamp-1">${p.title}</h3>
                        <p class="text-primary font-extrabold text-lg mt-auto pt-2">$${p.price}</p>
                    </div>
                </div>
            `;
            }).join('');

            if (totalPages > 1) {
                let pagesHtml = '';
                let showDotsBefore = false;
                let showDotsAfter = false;

                for (let i = 1; i <= totalPages; i++) {
                    if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                        pagesHtml += `
                            <button onclick="goToPage(${i})" class="w-10 h-10 rounded-xl font-medium text-sm transition ${currentPage === i ? 'bg-primary text-white shadow' : 'bg-white border text-gray-700 hover:bg-gray-100'}">
                                ${i}
                            </button>
                        `;
                    } else if (i < currentPage && !showDotsBefore && i > 1) {
                        pagesHtml += `<span class="px-2 text-gray-400 font-bold">...</span>`;
                        showDotsBefore = true;
                    } else if (i > currentPage && !showDotsAfter && i < totalPages) {
                        pagesHtml += `<span class="px-2 text-gray-400 font-bold">...</span>`;
                        showDotsAfter = true;
                    }
                }
                paginationContainer.innerHTML = pagesHtml;
                paginationContainer.classList.remove('hidden');
            } else {
                paginationContainer.innerHTML = '';
                paginationContainer.classList.add('hidden');
            }
        }

        window.goToPage = function(page) {
            currentPage = page;
            renderProducts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.openProductDetail = function(productId) {
            const p = currentProducts.find(item => item.id === productId);
            if (!p) return;

            let imageList = [];
            if (p.img) imageList.push(p.img);
            if (p.gallery && Array.isArray(p.gallery)) {
                p.gallery.forEach(imgUrl => {
                    if (imgUrl && !imageList.includes(imgUrl)) imageList.push(imgUrl);
                });
            }
            if (imageList.length === 0) imageList = ['https://via.placeholder.com/400?text=Sin+Imagen'];

            document.getElementById('detail-main-img').src = imageList[0];
            document.getElementById('detail-product-cat').innerText = p.cat;
            document.getElementById('detail-product-title').innerText = p.title;
            document.getElementById('detail-product-price').innerText = `$${p.price}`;
            document.getElementById('detail-product-desc').innerText = p.desc || "Sin descripción disponible para este producto.";
            
            const statusEl = document.getElementById('detail-product-status');
            const statusText = p.status || "Disponible";
            statusEl.innerText = statusText;
            if (statusText === 'Agotado') {
                statusEl.className = 'text-xs px-3 py-1 bg-red-100 text-red-800 rounded-full font-medium';
            } else {
                statusEl.className = 'text-xs px-3 py-1 bg-green-100 text-green-800 rounded-full font-medium';
            }

            const thumbsContainer = document.getElementById('detail-gallery-thumbs');
            if (imageList.length > 1) {
                thumbsContainer.innerHTML = imageList.map((imgUrl) => `
                    <img src="${imgUrl}" onclick="document.getElementById('detail-main-img').src='${imgUrl}'" class="w-12 h-12 object-cover rounded-lg cursor-pointer border-2 hover:border-primary transition flex-shrink-0">
                `).join('');
                thumbsContainer.classList.remove('hidden');
            } else {
                thumbsContainer.innerHTML = '';
                thumbsContainer.classList.add('hidden');
            }

            document.getElementById('product-detail-modal').classList.remove('hidden');
        }

        window.closeProductDetail = function() {
            document.getElementById('product-detail-modal').classList.add('hidden');
        }

        window.openAdminModal = function() {
            document.getElementById('admin-modal').classList.remove('hidden');
            document.getElementById('admin-pass-input').value = '';
            document.getElementById('admin-login-section').classList.remove('hidden');
            document.getElementById('admin-panel-content').classList.add('hidden');
            document.getElementById('product-form-container').classList.add('hidden');
        }

        window.closeAdminModal = function() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        window.verifyAdminPassword = function() {
            const pass = document.getElementById('admin-pass-input').value;
            const validPass = storeConfig.adminPass || "1234";
            if (pass === validPass) {
                document.getElementById('admin-login-section').classList.add('hidden');
                document.getElementById('admin-panel-content').classList.remove('hidden');
                document.getElementById('cfg-title').value = storeConfig.title || "";
                document.getElementById('cfg-subtitle').value = storeConfig.subtitle || "";
                document.getElementById('cfg-logo').value = storeConfig.logo || "";
                document.getElementById('cfg-color').value = storeConfig.primaryColor || "#881337";
                document.getElementById('cfg-pass').value = "";
                document.getElementById('admin-search-input').value = "";
                switchAdminTab('products');
                renderAdminProductsList();
            } else {
                alert("Contraseña incorrecta");
            }
        }

        window.renderAdminProductsList = function() {
            const list = document.getElementById('admin-products-list');
            const adminQuery = document.getElementById('admin-search-input') ? document.getElementById('admin-search-input').value.toLowerCase() : '';

            const filteredAdminProducts = currentProducts.filter(p => {
                return p.title.toLowerCase().includes(adminQuery) || (p.cat && p.cat.toLowerCase().includes(adminQuery));
            });

            if (filteredAdminProducts.length === 0) {
                list.innerHTML = `<div class="text-center py-4 text-gray-400 text-xs">No se encontraron productos.</div>`;
                return;
            }

            list.innerHTML = filteredAdminProducts.map(p => {
                let badge = p.status === 'Agotado' ? '<span class="text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded-full font-medium ml-1">Agotado</span>' : '<span class="text-[10px] bg-green-100 text-green-600 px-2 py-0.5 rounded-full font-medium ml-1">Disponible</span>';
                let hiddenBadge = p.isHidden ? '<span class="text-[10px] bg-gray-200 text-gray-700 px-2 py-0.5 rounded-full font-medium ml-1">Oculto</span>' : '';
                return `
                <div class="flex items-center justify-between p-2 bg-white rounded-xl border mb-2">
                    <div class="flex items-center gap-3">
                        <img src="${p.img}" class="w-10 h-10 object-cover rounded-lg">
                        <div>
                            <div class="flex items-center flex-wrap">
                                <h5 class="font-bold text-sm text-gray-800">${p.title}</h5>
                                ${badge}
                                ${hiddenBadge}
                            </div>
                            <p class="text-xs text-gray-500">$${p.price} • ${p.cat}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button type="button" onclick="editProduct(${p.id})" class="px-2.5 py-1 bg-blue-50 text-blue-600 rounded-lg text-xs font-medium hover:bg-blue-100">Editar</button>
                        <button type="button" onclick="deleteProduct(${p.id})" class="px-2.5 py-1 bg-red-50 text-red-600 rounded-lg text-xs font-medium hover:bg-red-100">Eliminar</button>
                    </div>
                </div>
            `;
            }).join('');
        }

        window.openProductForm = function() {
            document.getElementById('form-id').value = '';
            document.getElementById('form-title-input').value = '';
            document.getElementById('form-cat-input').value = '';
            document.getElementById('form-price-input').value = '';
            document.getElementById('form-img-input').value = '';
            document.getElementById('form-gallery-input').value = '';
            document.getElementById('form-desc-input').value = '';
            document.getElementById('form-status-input').value = 'Disponible';
            document.getElementById('form-hidden-input').checked = false;
            document.getElementById('form-action-title').innerText = "Nuevo Producto";
            document.getElementById('product-form-container').style.display = 'block';
        }

        window.editProduct = function(id) {
            const p = currentProducts.find(item => item.id == id);
            if (!p) return;
            document.getElementById('form-id').value = p.id;
            document.getElementById('form-title-input').value = p.title;
            document.getElementById('form-cat-input').value = p.cat;
            document.getElementById('form-price-input').value = p.price;
            document.getElementById('form-img-input').value = p.img || '';
            document.getElementById('form-gallery-input').value = p.gallery ? p.gallery.join(', ') : '';
            document.getElementById('form-desc-input').value = p.desc || '';
            document.getElementById('form-status-input').value = p.status || 'Disponible';
            document.getElementById('form-hidden-input').checked = !!p.isHidden;
            document.getElementById('form-action-title').innerText = "Editar Producto";
            document.getElementById('product-form-container').style.display = 'block';
        }

        window.cancelProductForm = function() {
            document.getElementById('product-form-container').style.display = 'none';
        }

        window.saveProductToCloud = async function() {
            const id = document.getElementById('form-id').value;
            const title = document.getElementById('form-title-input').value.trim();
            const cat = document.getElementById('form-cat-input').value.trim();
            const price = document.getElementById('form-price-input').value.trim();
            const img = document.getElementById('form-img-input').value.trim();
            const galleryRaw = document.getElementById('form-gallery-input').value.trim();
            const desc = document.getElementById('form-desc-input').value.trim();
            const status = document.getElementById('form-status-input').value;
            const isHidden = document.getElementById('form-hidden-input').checked;

            if (!title || !price || !cat) { alert('Completa nombre, categoría y precio.'); return; }

            let gallery = [];
            if (galleryRaw) {
                gallery = galleryRaw.split(',').map(s => s.trim()).filter(s => s.length > 0);
            }
            
            if (img && !gallery.includes(img)) {
                gallery.unshift(img);
            } else if (gallery.length === 0 && img) {
                gallery = [img];
            }

            const mainImg = img || (gallery.length > 0 ? gallery[0] : 'https://via.placeholder.com/400?text=Sin+Imagen');

            if (id) {
                const index = currentProducts.findIndex(p => p.id == id);
                if (index !== -1) {
                    currentProducts[index] = { ...currentProducts[index], title, cat, price, img: mainImg, gallery, desc, status, isHidden };
                }
            } else {
                const newId = currentProducts.length > 0 ? Math.max(...currentProducts.map(p => Number(p.id) || 0)) + 1 : 1;
                currentProducts.unshift({ id: newId, title, cat, price, img: mainImg, gallery, desc, status, isHidden });
            }

            try {
                const dataObject = {};
                currentProducts.forEach((p, idx) => { dataObject[idx] = p; });
                await setDoc(doc(db, "store_data", "products_list"), dataObject, { merge: true });
                alert('¡Producto guardado y sincronizado en la nube con éxito!');
                cancelProductForm();
                renderCategories();
                renderProducts();
                renderAdminProductsList();
            } catch (err) { alert('Error al guardar producto: ' + err.message); }
        }

        window.deleteProduct = async function(id) {
            if (!confirm('¿Estás seguro de eliminar este producto?')) return;
            currentProducts = currentProducts.filter(p => p.id != id);
            try {
                const dataObject = {};
                currentProducts.forEach((p, idx) => { dataObject[idx] = p; });
                await setDoc(doc(db, "store_data", "products_list"), dataObject, { merge: false });
                renderCategories();
                renderProducts();
                renderAdminProductsList();
                alert('Producto eliminado correctamente.');
            } catch (err) { alert('Error al eliminar: ' + err.message); }
        }

        loadStoreData();
    </script>
</body>
</html>
